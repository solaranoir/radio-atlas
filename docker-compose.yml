# docker-compose.yml

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radio_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio_atlas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-radio_atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-radio_atlas} -d ${POSTGRES_DB:-radio_atlas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADIO_ATLAS_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-radio_atlas}:${POSTGRES_PASSWORD:-radio_atlas_dev}@db:5432/${POSTGRES_DB:-radio_atlas}
      RADIO_ATLAS_REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/code/scripts/start-api.sh"]

volumes:
  postgres_data:
  redis_data:
