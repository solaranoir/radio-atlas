name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radio_atlas
          POSTGRES_PASSWORD: radio_atlas_dev
          POSTGRES_DB: radio_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radio_atlas -d radio_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RADIO_ATLAS_DATABASE_URL: postgresql+psycopg://radio_atlas:radio_atlas_dev@localhost:5432/radio_atlas

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

      - name: Validate package build
        run: python -m pip install .
