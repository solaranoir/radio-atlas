# Standalone project: no host ports, production volumes, providers, or host dependencies.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER from .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD from .env.example}
      POSTGRES_DB: radio_atlas_replay_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d radio_atlas_replay_test']
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ./backend
    environment:
      RADIO_ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/radio_atlas_replay_test
      RADIO_ATLAS_ENV: test
      RADIO_ATLAS_LOG_LEVEL: WARNING
      REPLAY_LOAD_SESSIONS: ${REPLAY_LOAD_SESSIONS:-32}
      REPLAY_LOAD_WORKERS: ${REPLAY_LOAD_WORKERS:-8}
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        alembic upgrade head &&
        pytest tests/unit/replay tests/unit/api/test_replay.py
        tests/unit/repositories/test_replay_observations.py tests/integration/replay
        --cov=app.replay --cov-report=term-missing --cov-fail-under=85 -s
